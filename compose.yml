name: ui

services:
  postgres:
    image: postgres:18.6
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    build: ./api
    env_file:
      - ./api/.env.prod
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --max-time 2 http://127.0.0.1:$${PORT:-2345}/health"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    restart: unless-stopped
  notifications:
    build: ./notifications
    env_file:
      - ./notifications/.env.prod
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --max-time 2 http://127.0.0.1:$${PORT:-2346}/health"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    restart: unless-stopped
  ui:
    build: ./ui
    ports:
      - 8080:80
    depends_on:
      - api
    restart: unless-stopped
  cloudflared:
    image: cloudflare/cloudflared:2026.10.3
    command: ["tunnel", "run"]
    env_file:
      - path: .cloudflared.env
        required: false
    depends_on:
      - ui
    restart: unless-stopped
volumes:
  postgres-data:
