name: ui

services:
  postgres:
    image: postgres:18.6
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./api/migrations/001_init.up.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./api/migrations/002_seed_demo.up.sql:/docker-entrypoint-initdb.d/002_seed_demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    build: ./api
    env_file:
      - ./.env
    depends_on:
      postgres:
          condition: service_healthy 
    restart: unless-stopped
  ui:
    build: ./ui
    ports:
      - 8080:80
    depends_on:
      - api
    restart: unless-stopped
  cloudflared:
    image: cloudflare/cloudflared:2026.10.3
    command: ["tunnel", "run"]
    env_file:
      - path: .cloudflared.env
        required: false
    depends_on:
      - ui
    restart: unless-stopped
volumes:
  postgres-data:
