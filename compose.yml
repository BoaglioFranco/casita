name: ui

services:
  api:
    build: ./api
    env_file:
      - ./.env
    environment:
      - DB_PATH=/data/groceries.db
    volumes:
      - sqlite-data:/data
    restart: unless-stopped
  ui:
    build: ./ui
    ports:
      - 8080:80
    depends_on:
      - api
    restart: unless-stopped
volumes:
  sqlite-data:
